<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="author" content="Eliseo Peirano">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isoelettrica</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Isoelettrica">
<meta name="theme-color" content="#121926">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#eceff3; --panel:#fbfcfd; --fg:#141a24; --muted:#5a6473; --line:#d6dce4; --chip:#e7ebf0;
  --accent:#c21d3b; --accent-soft:rgba(194,29,59,.1); --ok:#17784c; --bad:#c21d3b; --warn:#9a5b06;
  --paper:#fff8f6; --grid:#f5d5cd; --grid2:#e3a193; --trace:#161b24; --hl:rgba(194,29,59,.08);
  --stage:#121926; --stage-fg:#e4e9f2;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0e14; --panel:#111721; --fg:#e4e9f1; --muted:#8c97a8; --line:#222c3a; --chip:#1a2230;
    --accent:#ff5d78; --accent-soft:rgba(255,93,120,.12); --ok:#48d38f; --bad:#ff5d78; --warn:#f0b24a;
    --paper:#07110d; --grid:#10261b; --grid2:#1c4632; --trace:#79f5ab; --hl:rgba(121,245,171,.07);
    --stage:#0a0f18; --stage-fg:#e4e9f2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0e14; --panel:#111721; --fg:#e4e9f1; --muted:#8c97a8; --line:#222c3a; --chip:#1a2230;
  --accent:#ff5d78; --accent-soft:rgba(255,93,120,.12); --ok:#48d38f; --bad:#ff5d78; --warn:#f0b24a;
  --paper:#07110d; --grid:#10261b; --grid2:#1c4632; --trace:#79f5ab; --hl:rgba(121,245,171,.07);
  --stage:#0a0f18; --stage-fg:#e4e9f2;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;overflow-x:hidden;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.logo svg{width:26px;height:26px}
.nav{display:flex;gap:2px;background:var(--chip);padding:3px;border-radius:10px;margin-left:6px}
.nav button{border:none;background:transparent;padding:6px 14px;border-radius:8px;font-weight:500;color:var(--muted)}
.nav button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:9px;height:34px;min-width:34px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.iconbtn svg{width:16px;height:16px}

.view{flex:1;display:none;min-height:0}
.view.on{display:flex}

/* --- Tracciato --- */
#v-trace{display:none}
#v-trace.on{display:grid;grid-template-columns:270px minmax(0,1fr)}
.lib{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.lib .search{padding:10px 12px;border-bottom:1px solid var(--line)}
.lib input[type=search]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 10px}
.lib .list{overflow:auto;padding:4px 0 24px;flex:1}
.lib h4{margin:14px 14px 4px;font-size:12.5px;color:var(--muted);font-weight:600}
.lib button.item{display:block;width:100%;text-align:left;border:none;background:none;padding:7px 14px;font-size:13.5px;border-left:3px solid transparent}
.lib button.item.on{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
.main{min-width:0;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar .ttl{flex:1 1 160px;min-width:0}
.bar h2{margin:0;font-size:16.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ctrls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bar .cat{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:none;background:transparent;padding:5px 10px;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--chip);color:var(--fg);font-weight:600}
.play{width:34px;height:34px;border-radius:50%;border:none;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.play svg{width:13px;height:13px;fill:currentColor}
.tool.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.measures{display:flex;gap:4px 16px;flex-wrap:wrap;padding:6px 12px;font-size:12.5px;color:var(--muted);background:var(--panel);border-bottom:1px solid var(--line)}
.measures b{color:var(--fg);font-weight:600}
.ecgwrap{position:relative;background:var(--paper);border-bottom:1px solid var(--line);flex:none}
.ecgwrap canvas{display:block;width:100%}
.ecgwrap canvas.ov{position:absolute;inset:0;height:100%}
.lower{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:320px}
.stage{position:relative;background:var(--stage);min-height:300px;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;z-index:2}
.hud.tl{left:10px;top:10px;display:flex;flex-direction:column;gap:4px;max-width:36%}
.hud.tr{right:10px;top:10px;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:62%}
.hud.bl{left:10px;bottom:10px;right:10px;color:rgba(228,233,242,.6);font-size:12px;pointer-events:none}
.hudbtn{background:rgba(8,12,20,.62);color:var(--stage-fg);border:1px solid rgba(255,255,255,.13);border-radius:7px;padding:3px 8px;font-size:11.5px;text-align:left;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hudbtn.on{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.14)}
.phase{background:rgba(8,12,20,.62);color:var(--stage-fg);border-radius:9px;padding:5px 9px;font-size:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{border:none;background:none;padding:8px 10px 9px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.pane{display:none;overflow:auto;padding:4px 16px 30px;flex:1}
.pane.on{display:block}
.sec{padding:12px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:none}
.sec h3{margin:0 0 6px;font-size:13.5px;font-weight:650}
.sec p{margin:4px 0;color:var(--muted);max-width:66ch}
.sec p.lead{color:var(--fg);font-size:14.5px}
ul.crit{list-style:none;margin:4px 0;padding:0}
ul.crit li{position:relative;padding:4px 0 4px 22px;color:var(--fg)}
ul.crit li::before{content:"";position:absolute;left:2px;top:10px;width:10px;height:6px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
ul.dd{margin:4px 0;padding-left:18px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.src{font-size:12px;color:var(--muted)}
.ctrl{margin:10px 0}
.ctrl .lab{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:3px}
.ctrl .lab output{font-weight:600}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:9px;padding:7px 12px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.note{font-size:12.5px;color:var(--muted)}

/* --- Teoria --- */
#v-theory{display:none}
#v-theory.on{display:grid;grid-template-columns:260px minmax(0,1fr)}
.toc{border-right:1px solid var(--line);background:var(--panel);padding:10px 0;overflow:auto}
.toc button{display:block;width:100%;text-align:left;border:none;background:none;padding:9px 16px;border-left:3px solid transparent;font-size:14px}
.toc button.on{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
.article{overflow:auto;padding:22px max(24px,env(safe-area-inset-right)) 60px 32px}
.article h1{font-size:26px;letter-spacing:-.02em;margin:0 0 14px;font-weight:700;max-width:30ch}
.article h4{font-size:15px;margin:22px 0 6px}
.article p{max-width:68ch;margin:8px 0;font-size:15px;line-height:1.6}
.ttab{border-collapse:collapse;width:100%;max-width:820px;font-size:13.5px;margin:10px 0}
.ttab th,.ttab td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.ttab th{color:var(--muted);font-weight:500}
.widget{margin:18px 0;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px;max-width:820px}
.widget canvas{width:100%;display:block;border-radius:6px}
.wrow{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.wrow .ctrl{flex:1;min-width:200px}
.big{font-size:22px;font-weight:700}

/* --- Quiz --- */
#v-quiz{display:none}
#v-quiz.on{display:flex;flex-direction:column}
.qhead{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.qhead h2{margin:0;font-size:16.5px}
.score{margin-left:auto;font-size:13px;color:var(--muted)}
.qbody{display:grid;grid-template-columns:minmax(0,1fr) 380px;flex:1;min-height:0}
.qleft{display:flex;flex-direction:column;min-width:0}
.qright{border-left:1px solid var(--line);background:var(--panel);padding:14px 16px 30px;overflow:auto}
.opts{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.opts button{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:11px 12px;text-align:left;font-size:14.5px}
.opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);font-weight:600}
.opts button.wrong{border-color:var(--bad);background:var(--accent-soft)}
.opts button:disabled{cursor:default}
.qfilter{display:flex;flex-wrap:wrap;gap:5px}

/* drawer libreria su schermi stretti */
.libbtn{display:none}
.scrim{display:none}
@media (max-width:1060px){
  #v-trace.on{grid-template-columns:minmax(0,1fr)}
  .lib{position:fixed;left:0;top:0;bottom:0;width:min(320px,86vw);z-index:40;transform:translateX(-102%);transition:transform .22s ease;padding-top:env(safe-area-inset-top);box-shadow:0 0 40px rgba(0,0,0,.25)}
  .lib.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:39}
  .libbtn{display:inline-flex}
  .lower{grid-template-columns:minmax(0,1fr)}
  .stage{height:420px;flex:none}
  .card{border-left:none;border-top:1px solid var(--line)}
  .pane{overflow:visible}
  #v-trace.on .main{min-height:auto}
  .qbody{grid-template-columns:minmax(0,1fr)}
  .qright{border-left:none;border-top:1px solid var(--line)}
}
@media (max-width:760px){
  #v-theory.on{grid-template-columns:minmax(0,1fr)}
  .toc{display:flex;overflow-x:auto;padding:0;border-right:none;border-bottom:1px solid var(--line)}
  .toc button{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;width:auto}
  .toc button.on{border-bottom-color:var(--accent)}
  .article{padding:18px 16px 60px}
  .logo span{display:none}
  .nav button{padding:6px 10px}
}
@media (min-width:1061px){
  .app{height:100vh;height:100dvh}
  .view{overflow:hidden}
  .main{overflow:auto}
}
@media (prefers-reduced-motion: reduce){ .lib{transition:none} }

.sec.corso{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:10px 0}
.sec.corso h3{color:var(--accent)}

#v-atlas.on{display:grid;grid-template-columns:260px minmax(0,1fr)}
.agrid-wrap{overflow:auto;padding:14px 16px 60px}
.asearch{position:sticky;top:0;background:var(--bg);padding:2px 0 10px;z-index:2}
.asearch input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--fg);font:inherit}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit}
.acard img{display:block;width:100%;height:135px;object-fit:cover;object-position:top;background:var(--chip)}
.acard .at{padding:8px 10px;font-size:12.5px;font-weight:600;line-height:1.3}
.acard .as{padding:0 10px 9px;font-size:11px;color:var(--muted)}
.acard:hover{border-color:var(--accent)}
.ahead{grid-column:1/-1;margin:10px 0 2px;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.02em;text-transform:uppercase}
.lbox{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.lbar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top))}
.lbar b{flex:1;font-size:14px;min-width:0}
.lbtns{display:flex;gap:8px}
.lwrap{flex:1;overflow:auto;background:#0d1117;display:flex;align-items:flex-start;justify-content:center;-webkit-overflow-scrolling:touch}
.lwrap img{max-width:100%;height:auto;display:block}
.lwrap.zoom{align-items:flex-start;justify-content:flex-start}
.lwrap.zoom img{max-width:none;width:250%}
.lcap{padding:10px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);max-height:34vh;overflow:auto}
.lcap p{margin:0 0 6px;font-size:13.5px;line-height:1.45}
@media (max-width:760px){
  #v-atlas.on{grid-template-columns:minmax(0,1fr)}
  #v-atlas .toc{display:flex;overflow-x:auto;padding:0;border-right:none;border-bottom:1px solid var(--line)}
  #v-atlas .toc button{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;width:auto}
  #v-atlas .toc button.on{border-bottom-color:var(--accent)}
  .agrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .acard img{height:100px}
}
.lmiss{color:#cbd5e1;font-size:14px;line-height:1.5;max-width:520px;margin:auto;padding:40px 24px;text-align:center}

#v-anat.on{display:block;padding:0;overflow:hidden;min-height:78vh;min-height:78dvh}
#v-anat iframe{border:0;width:100%;height:100%;display:block;background:var(--stage)}

.credit{font-size:11.5px;color:var(--muted);white-space:nowrap;letter-spacing:.01em}
.foot{margin:26px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);text-align:center}
@media (max-width:860px){.credit{display:none}}
.hudrange{width:104px;accent-color:var(--accent);vertical-align:middle}
@media (max-width:760px){.hudrange{width:74px}}
.item .hit{display:block;font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:2px;white-space:normal}
.item mark{background:var(--accent-soft);color:var(--accent);padding:0 1px;border-radius:3px}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}
.app{height:100%;min-height:0}
#v-trace.on{overflow:auto;-webkit-overflow-scrolling:touch}
#v-theory.on,#v-quiz.on{min-height:0}
#v-quiz.on{overflow:auto;-webkit-overflow-scrolling:touch}
.top{position:relative;z-index:40;background:var(--panel);isolation:isolate}
@supports (-webkit-touch-callout:none){.top{backdrop-filter:none;-webkit-backdrop-filter:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo" aria-label="Isoelettrica">
      <svg viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="var(--accent)"/><path d="M3 15h5l1.6-3 2.2 8 2.6-15 2.2 10h6.4" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span>Isoelettrica</span>
    </div>
    <nav class="nav" id="nav">
      <button data-v="trace" class="on">Tracciato</button>
      <button data-v="theory">Teoria</button>
      <button data-v="atlas">Atlante</button>
      <button data-v="anat">Anatomia</button>
      <button data-v="quiz">Quiz</button>
    </nav>
    <div class="spacer"></div>
    <span class="credit">App made by Eliseo Peirano · 2026</span>
    <button class="iconbtn" id="themeBtn" aria-label="Cambia tema chiaro o scuro" title="Tema"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
  </header>

  <!-- TRACCIATO -->
  <section class="view on" id="v-trace">
    <aside class="lib" id="lib">
      <div class="search"><input type="search" id="q" placeholder="Cerca per nome o criterio: QRS largo, PR corto, onda delta…" aria-label="Cerca un quadro o un criterio"></div>
      <div class="list" id="libList"></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <div class="bar">
        <button class="iconbtn libbtn" id="libBtn" aria-label="Apri la libreria"><svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Libreria</button>
        <div class="ttl"><h2 id="scTitle">—</h2><div class="cat" id="scCat"></div></div>
        <div class="ctrls">
        <button class="play" id="playBtn" aria-label="Pausa"></button>
        <div class="seg" id="modeSeg"><button data-m="print" class="on">12 derivazioni</button><button data-m="monitor">Monitor</button></div>
        <div class="seg" id="speedSeg" aria-label="Velocità carta"><button data-s="25" class="on">25 mm/s</button><button data-s="50">50</button></div>
        <div class="seg" id="gainSeg" aria-label="Guadagno in mm/mV"><button data-g="5">5</button><button data-g="10" class="on">10</button><button data-g="20">20</button></div>
        <div class="seg" id="slowSeg" aria-label="Tempo"><button data-t="1" class="on">1×</button><button data-t="0.25">¼×</button></div>
        <button class="iconbtn tool" id="calBtn" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="M5 2v12M11 2v12M5 8h6" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>Compasso</button>
        </div>
      </div>
      <div class="measures num" id="measures"></div>
      <div class="ecgwrap" id="ecgWrap"><canvas id="ecg"></canvas><canvas id="ecgOv" class="ov"></canvas></div>
      <div class="lower">
        <div class="stage" id="stage">
          <div class="hud tl"><div class="phase" id="phase3d">—</div></div>
          <div class="hud tr" id="hud3d">
            <button class="hudbtn on" data-cam="iso">3D</button>
            <button class="hudbtn" data-cam="front">Frontale</button>
            <button class="hudbtn" data-cam="top">Orizzontale</button>
            <button class="hudbtn on" data-tg="orb">Orbitali</button>
            <button class="hudbtn on" data-tg="heart">Cuore schematico</button>
            <button class="hudbtn" data-tg="anat">Cuore anatomico</button>
            <input id="hOpac" class="hudrange" type="range" min="12" max="100" step="1" value="60" aria-label="Trasparenza del cuore" title="Trasparenza del cuore">
            <button class="hudbtn on" data-tg="leads">Derivazioni</button>
          </div>
          <div class="hud bl" id="hint3d">Tocca una derivazione nel tracciato per vederne la proiezione</div>
        </div>
        <div class="card">
          <div class="tabs" id="cardTabs"><button data-p="card" class="on">Scheda</button><button data-p="params">Parametri</button></div>
          <div class="pane on" id="p-card"></div>
          <div class="pane" id="p-params"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- TEORIA -->
  <section class="view" id="v-theory">
    <nav class="toc" id="toc"></nav>
    <article class="article" id="article"></article>
  </section>

  <!-- ANATOMIA: Orbitali ECG -->
  <section class="view" id="v-anat"><iframe id="anatFrame" title="Orbitali ECG" loading="lazy"></iframe></section>

  <!-- ATLANTE -->
  <section class="view" id="v-atlas">
    <nav class="toc" id="atoc"></nav>
    <div class="agrid-wrap">
      <div class="asearch"><input id="aSearch" type="search" placeholder="Cerca nell'atlante: BBSx, Wenckebach, infarto inferiore…" aria-label="Cerca nell'atlante"></div>
      <div class="agrid" id="agrid"></div>
      <p class="foot">Isoelettrica — App made by Eliseo Peirano · 2026</p>
    </div>
  </section>

  <div class="lbox" id="lbox" hidden>
    <div class="lbar">
      <b id="lbTitle"></b>
      <div class="lbtns">
        <button class="btn" id="lbZoom">Ingrandisci</button>
        <button class="btn" id="lbOpen" hidden>Apri il quadro</button>
        <button class="btn" id="lbClose" aria-label="Chiudi">Chiudi</button>
      </div>
    </div>
    <div class="lwrap" id="lwrap"><img id="lbImg" alt=""><p class="lmiss" id="lbMiss" hidden></p></div>
    <div class="lcap"><p id="lbNote"></p><p class="src" id="lbSrc"></p><p class="src">Isoelettrica — App made by Eliseo Peirano · 2026</p></div>
  </div>

  <!-- QUIZ -->
  <section class="view" id="v-quiz">
    <div class="qhead">
      <h2>Che ECG è?</h2>
      <div class="qfilter" id="qFilter"></div>
      <button class="btn" id="qPause" aria-label="Metti in pausa il tracciato">Pausa</button>
      <span class="score num" id="score"></span>
    </div>
    <div class="qbody">
      <div class="qleft">
        <div class="ecgwrap" id="qEcgWrap"><canvas id="qEcg"></canvas><canvas id="qEcgOv" class="ov"></canvas></div>
        <div class="measures num" id="qMeasures"><span>Le misure compaiono dopo la risposta</span></div>
      </div>
      <div class="qright" id="qRight"></div>
    </div>
  </section>
</div>
