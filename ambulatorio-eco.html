<style>
:root{color-scheme:dark;--panel:#17212b;--bg:#0a1016;--fg:#e9eef2;--line:#394651;--muted:#adbdc6;--accent:#b7e6cf}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui}button{font:inherit;cursor:pointer;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}.btn.on{background:#285446}#v-eco{height:100dvh}.eco-viste,.eco-quadri,#ecoZero,#ecoAllena,#ecoTesto,label:has(#ecoFc),label:has(#ecoCo){display:none}a{color:#9ee2cc}
</style>
<section id="v-eco" class="view on" aria-label="Ecocardiografo"></section>

<script src="ambulatorio.js?v=47.8"></script><script src="./ecocardio/core.js?v=47.8"></script><script src="./ecocardio/raster.js?v=47.8"></script><script src="eco-anatomia.js?v=47.8"></script>

<script>
document.addEventListener('DOMContentLoaded',()=>{
  const view=document.getElementById('v-eco'),id=location.hash.slice(1);
  function prepara(){if(window.ISO_ECO && ISO_ECO.avviaCaso(id))monitor.disconnect();}
  const monitor=new MutationObserver(prepara);monitor.observe(view,{attributes:true,attributeFilter:['data-torace','data-pronto']});prepara();
});
</script>
